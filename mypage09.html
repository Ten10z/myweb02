<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- HTML Form Tag (block) -->
    <form action="" method="">
      <!-- ตระกูลป้อน -->
      <label for="">ป้อนอะไรก็ได้*: </label>
      <input type="text" name="" id="" placeholder="ชื่อ-นามสกุล" required />
      <br /><br />
      <label for="">ป้อนตัวเลข: </label>
      <input type="number" name="" id="" placeholder="อายุ" />
      <br /><br />
      <label for="">ป้อนรหัสผ่าน: </label>
      <input
        type="password"
        name=""
        id=""
        placeholder="ไม่ต่ำกว่า 6 ตัวอักษร"
      />
      <br /><br />
      <label for="">ป้อนอีเมล: </label>
      <input type="email" name="" id="" placeholder="example@mail.com" />
      <br /><br />
      <label for="">ป้อนอะไรก็ได้ที่เนื้อหาเยอะๆ: </label>
      <textarea name="" id="" cols="30" rows="5"></textarea>
      <br /><br />
      <!-- ตระกูลเลือก radio -->
      <!-- เลือกได้แค่ 1 และต้องเลือก select option -->
      <label for="">เพศ: </label>
      <input type="radio" name="gender" id="" checked />ชาย
      <input type="radio" name="gender" id="" />หญิง
      <input type="radio" name="gender" id="" />LGBTQ+
      <input type="radio" name="gender" id="" />ไม่ระบุ <br /><br />
      <label for="">จังหวัดบ้านเกิด: </label>
      <select name="" id="">
        <!-- dropdown, combo box -->
        <option value="">กรุงเทพ</option>
        <option value="">เชียงใหม่</option>
        <option value="">ภูเก็ต</option>
        <option value="">ชลบุรี</option>
        <option value="">ตรัง</option>
        <option value="">นครศรีธรรมราช</option>
      </select>
      <br /><br />
      <label for="">Major: </label>
      <select name="" id="" size="4">
        <!-- List box -->
        <option value="">ตลาด</option>
        <option value="">บัญชี</option>
        <option value="" selected>คอมพิวเตอร์</option>
        <option value="">โยธา</option>
        <option value="">ไฟฟ้า</option>
        <option value="">มีเดีย</option>
      </select>
      <br /><br />
      <!-- เลือกได้มากกว่า 1 หรือไม่เลือกก็ได้ checkbox -->
      <label for="">อาหารที่ชอบ: </label>
      <input type="checkbox" name="" id="" />KFC
      <input type="checkbox" name="" id="" />Pizza
      <input type="checkbox" name="" id="" />Oishi
      <input type="checkbox" name="" id="" />McDonalds
      <input type="checkbox" name="" id="" checked />MK <br /><br />
      <!-- เลือกไฟล์ -->
      <!-- เลือกไฟล์แบบไม่กรอง (no filter) -->
      <label for="">เลือกไฟล์อะไรก็ได้: </label>
      <input type="file" name="" id="" />
      <br><br>
      <!-- เลือกไฟล์แบบกรอง (filter) -->
       <label for="">เลือกไฟล์รูป: </label>
       <input type="file" name="" id="" accept="image/*">
       <br><br>
       <label for="">เลือกไฟล์ Word/Excel/PDF: </label>
       <input type="file" name="" id="" accept=".doc,.docx,.xls,.xlsx,.pdf">
       <br><br>
       <!-- เลือก วัน เวลา -->
       <label for="">วันเกิด: </label>
       <input type="date" name="" id="">
       <br><br>
       <label for="">เวลาเกิด: </label>
       <input type="time" name="" id="">
       <br><br>
       <label for="">วัน/เวลา เข้าทำงาน: </label>
       <input type="datetime-local" name="" id="">
       <br><br>
       <!-- ตระกูลปุ่ม -->
        <input type="submit" value="ตกลง/บันทึก/ลบ/แก้ไข/ใช่">
        <br><br>
        <input type="reset" value="ยกเลิก/ล้างข้อมูล/รีเซ็ต">
        <br><br>
        <button>ตกลง/บันทึก/ลบ/แก้ไข/ใช่/ยกเลิก/ล้างข้อมูล/รีเซ็ต</button>
    </form>
  </body>
</html>
